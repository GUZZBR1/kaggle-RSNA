[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-rsna"
version = "0.1.0"
description = "Reproducible experiment foundation for RSNA knee MRI classification"
requires-python = ">=3.11"
dependencies = ["pydicom>=2.4"]

[project.scripts]
kaggle-rsna = "rsna.cli:main"

[project.optional-dependencies]
ray = ["ray>=2.40"]
training = ["numpy>=1.26", "torch>=2.4"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["rsna*"]
